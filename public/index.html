<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eksporto ne Excel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      padding: 48px 44px 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      border: 1px solid #334155;
    }

    /* Logo icon */
    .logo-icon {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background: linear-gradient(135deg, #10b981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
    }

    .logo-icon svg {
      width: 30px;
      height: 30px;
      fill: white;
    }

    h1 {
      color: #f1f5f9;
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 36px;
      font-size: 14px;
      font-weight: 400;
    }

    /* Upload area */
    .upload-area {
      position: relative;
      border: 2px dashed #334155;
      border-radius: 12px;
      padding: 44px 24px;
      margin-bottom: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #0f172a;
    }

    .upload-area:hover,
    .upload-area.dragover {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.04);
    }

    .upload-area.has-file {
      border-color: #10b981;
      border-style: solid;
      background: rgba(16, 185, 129, 0.06);
    }

    .upload-icon {
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }

    .upload-icon svg {
      width: 44px;
      height: 44px;
    }

    .upload-text {
      color: #64748b;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .upload-area.has-file .upload-text {
      color: #10b981;
    }

    .file-name {
      color: #10b981;
      font-weight: 600;
      font-size: 14px;
      margin-top: 8px;
      word-break: break-all;
    }

    /* Clear file button (X) */
    .clear-btn {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #dc2626;
      color: white;
      font-size: 16px;
      line-height: 28px;
      text-align: center;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-weight: 500;
    }

    .clear-btn:hover {
      background: #b91c1c;
      transform: scale(1.05);
    }

    input[type="file"] { display: none; }

    /* Buttons */
    .btn {
      padding: 15px 32px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      letter-spacing: 0.3px;
      border: none;
      font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      background: #1e293b;
      border: 1px solid #334155;
      color: #475569;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #334155;
      color: #94a3b8;
      margin-top: 12px;
      display: none;
    }

    .btn-outline:hover {
      border-color: #10b981;
      color: #10b981;
      background: rgba(16, 185, 129, 0.06);
    }

    /* Status messages */
    .status {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      display: none;
      text-align: left;
      animation: slideIn 0.3s ease;
    }

    .status.error {
      background: rgba(220, 38, 38, 0.1);
      color: #f87171;
      border: 1px solid rgba(220, 38, 38, 0.2);
      border-left: 4px solid #dc2626;
      display: block;
    }

    .status.success {
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-left: 4px solid #10b981;
      display: block;
    }

    .status.loading {
      background: rgba(245, 158, 11, 0.1);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-left: 4px solid #f59e0b;
      display: block;
      text-align: center;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #fbbf24;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .footer {
      font-size: 12px;
      color: #334155;
      margin-top: 32px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
        <path d="M8 13h8v1.5H8zM8 16h5v1.5H8z"/>
      </svg>
    </div>

    <h1>EKSPORTO NE EXCEL</h1>
    <p class="subtitle">Ngarko faturen PDF dhe shkarkoje ne Excel</p>

    <!-- Upload area: click or drag-and-drop -->
    <div class="upload-area" id="uploadArea">
      <span class="clear-btn" id="clearFile" title="Hiq skedarin">&times;</span>
      <div class="upload-icon" id="uploadIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p class="upload-text" id="uploadText">Kliko ose terhiq skedarin PDF ketu</p>
      <p class="file-name" id="fileName"></p>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept=".pdf">

    <!-- Action buttons -->
    <button class="btn btn-primary" id="exportBtn" disabled>Eksporto ne Excel</button>
    <button class="btn btn-outline" id="resetBtn">Ngarko PDF te re</button>

    <!-- Status message -->
    <div class="status" id="status"></div>

    <!-- Footer -->
    <p class="footer">Invoice Parser v1.0</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
