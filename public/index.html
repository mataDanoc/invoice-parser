<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Konverto faturat PDF shqiptare ne Excel automatikisht. Nxjerr te dhenat e produkteve, sasive dhe cmimeve ne disa sekonda.">
  <title>Invoice Parser — PDF ne Excel</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'%3E%3Cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: #0a0f1e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle gradient orbs in background */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
    }

    body::before {
      width: 600px;
      height: 600px;
      background: #10b981;
      top: -200px;
      right: -100px;
    }

    body::after {
      width: 500px;
      height: 500px;
      background: #3b82f6;
      bottom: -150px;
      left: -100px;
    }

    .container {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      padding: 48px 44px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* Logo icon */
    .logo-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow:
        0 8px 32px rgba(16, 185, 129, 0.3),
        0 0 0 1px rgba(16, 185, 129, 0.2);
      transition: transform 0.3s ease;
    }

    .logo-icon:hover {
      transform: scale(1.05);
    }

    .logo-icon svg {
      width: 30px;
      height: 30px;
      fill: white;
    }

    h1 {
      color: #f1f5f9;
      margin-bottom: 6px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 32px;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    /* Upload area */
    .upload-area {
      position: relative;
      border: 2px dashed #334155;
      border-radius: 14px;
      padding: 40px 24px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(15, 23, 42, 0.6);
    }

    .upload-area:hover,
    .upload-area.dragover {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.04);
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.06);
    }

    .upload-area.has-file {
      border-color: #10b981;
      border-style: solid;
      background: rgba(16, 185, 129, 0.06);
    }

    .upload-icon {
      margin-bottom: 12px;
      transition: all 0.3s ease;
    }

    .upload-icon svg {
      width: 44px;
      height: 44px;
    }

    .upload-text {
      color: #64748b;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .upload-area.has-file .upload-text {
      color: #10b981;
    }

    .file-info {
      margin-top: 10px;
    }

    .file-name {
      color: #10b981;
      font-weight: 600;
      font-size: 14px;
      word-break: break-all;
    }

    .file-size {
      color: #475569;
      font-size: 12px;
      font-weight: 500;
      margin-top: 2px;
    }

    /* Clear file button (X) */
    .clear-btn {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(220, 38, 38, 0.15);
      color: #f87171;
      font-size: 16px;
      line-height: 28px;
      text-align: center;
      cursor: pointer;
      border: 1px solid rgba(220, 38, 38, 0.2);
      transition: all 0.2s;
      font-weight: 500;
    }

    .clear-btn:hover {
      background: #dc2626;
      color: white;
      border-color: #dc2626;
      transform: scale(1.05);
    }

    input[type="file"] { display: none; }

    /* Buttons */
    .btn {
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      letter-spacing: 0.3px;
      border: none;
      font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      color: #475569;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #334155;
      color: #94a3b8;
      margin-top: 10px;
      display: none;
    }

    .btn-outline:hover {
      border-color: #10b981;
      color: #10b981;
      background: rgba(16, 185, 129, 0.06);
    }

    /* Status messages */
    .status {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      display: none;
      text-align: left;
      animation: slideIn 0.3s ease;
    }

    .status.error {
      background: rgba(220, 38, 38, 0.08);
      color: #f87171;
      border: 1px solid rgba(220, 38, 38, 0.15);
      border-left: 4px solid #dc2626;
      display: block;
    }

    .status.success {
      background: rgba(16, 185, 129, 0.08);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.15);
      border-left: 4px solid #10b981;
      display: block;
    }

    .status.loading {
      background: rgba(245, 158, 11, 0.08);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.15);
      border-left: 4px solid #f59e0b;
      display: block;
      text-align: center;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #fbbf24;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Export results card */
    .export-result {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: rgba(16, 185, 129, 0.06);
      border: 1px solid rgba(16, 185, 129, 0.15);
      border-radius: 12px;
      animation: slideIn 0.4s ease;
    }

    .export-result.show {
      display: block;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
    }

    .result-label {
      color: #64748b;
      font-size: 13px;
      font-weight: 500;
    }

    .result-value {
      color: #10b981;
      font-size: 14px;
      font-weight: 700;
    }

    .result-divider {
      height: 1px;
      background: rgba(16, 185, 129, 0.1);
      margin: 6px 0;
    }

    /* Separator */
    .separator {
      height: 1px;
      background: linear-gradient(90deg, transparent, #334155, transparent);
      margin: 24px 0;
    }

    /* Public link box */
    .public-link-box {
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #1e293b;
      border-radius: 12px;
      text-align: left;
    }

    .public-link-label {
      font-size: 11px;
      color: #475569;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .public-link-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .public-link-url {
      font-size: 13px;
      color: #10b981;
      font-weight: 500;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .public-link-url.loading {
      color: #475569;
      font-style: italic;
    }

    .copy-btn {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: inherit;
    }

    .copy-btn:hover { background: #10b981; color: #fff; }
    .copy-btn:disabled { opacity: 0.3; cursor: default; }

    /* Footer */
    .footer {
      font-size: 12px;
      color: #1e293b;
      margin-top: 20px;
      font-weight: 500;
    }

    /* Responsive */
    @media (max-width: 540px) {
      .container {
        padding: 32px 24px 28px;
        border-radius: 16px;
      }

      h1 { font-size: 22px; }

      .upload-area { padding: 32px 16px; }

      .btn { padding: 13px 24px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zM6 20V4h7v5h5v11H6z"/>
        <path d="M8 13h8v1.5H8zM8 16h5v1.5H8z"/>
      </svg>
    </div>

    <h1>INVOICE PARSER</h1>
    <p class="subtitle">Ngarko faturen PDF dhe shkarkoje te konvertuar ne Excel</p>

    <!-- Upload area: click or drag-and-drop -->
    <div class="upload-area" id="uploadArea">
      <span class="clear-btn" id="clearFile" title="Hiq skedarin">&times;</span>
      <div class="upload-icon" id="uploadIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p class="upload-text" id="uploadText">Kliko ose terhiq skedarin PDF ketu</p>
      <div class="file-info" id="fileInfo" style="display:none">
        <p class="file-name" id="fileName"></p>
        <p class="file-size" id="fileSize"></p>
      </div>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" accept=".pdf">

    <!-- Action buttons -->
    <button class="btn btn-primary" id="exportBtn" disabled>Eksporto ne Excel</button>
    <button class="btn btn-outline" id="resetBtn">Ngarko PDF te re</button>

    <!-- Status message -->
    <div class="status" id="status"></div>

    <!-- Export results -->
    <div class="export-result" id="exportResult">
      <div class="result-row">
        <span class="result-label">Produkte te gjetura</span>
        <span class="result-value" id="resultRowCount">0</span>
      </div>
      <div class="result-divider"></div>
      <div class="result-row">
        <span class="result-label">Skedari</span>
        <span class="result-value" id="resultFileName" style="font-size:12px;font-weight:600">—</span>
      </div>
    </div>

    <!-- Separator -->
    <div class="separator"></div>

    <!-- Public link -->
    <div class="public-link-box">
      <div class="public-link-label">Link publik</div>
      <div class="public-link-row">
        <span class="public-link-url loading" id="publicUrl">duke u lidhur...</span>
        <button class="copy-btn" id="copyBtn" disabled onclick="copyLink()">Kopjo</button>
      </div>
    </div>

    <!-- Footer -->
    <p class="footer">Invoice Parser v1.0</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
